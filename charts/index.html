<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700;800;900&display=swap"
			rel="stylesheet"
		/>

		<!-- Load Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

		<!-- Tailwind CSS Configuration -->
		<script>
			tailwind.config = {
				theme: {
					extend: {
						fontFamily: {
							sans: ["Nunito", "sans-serif"]
						},
						colors: {
							primary: "#1a73e8",
							secondary: "#155ab6",
							neutral: "#f8f8f8",
							textPrimary: "#333",
							textSecondary: "#444"
						},
						fontSize: {
							h1: ["2.25em", { lineHeight: "1.2", fontWeight: "800" }],
							h2: ["2em", { lineHeight: "1.2", fontWeight: "700" }],
							h3: ["1.75em", { lineHeight: "1.2", fontWeight: "600" }],
							h4: ["1.5em", { lineHeight: "1.2", fontWeight: "600" }],
							h5: ["1.25em", { lineHeight: "1.2", fontWeight: "500" }],
							h6: ["1em", { lineHeight: "1.2", fontWeight: "500" }],
							body: ["1rem", { lineHeight: "1.6", fontWeight: "400" }]
						}
					}
				}
			};
		</script>
	</head>
	<body class="font-sans text-gray-900 bg-white">
		<div class="container mx-auto p-2">
			<div class="flex items-center space-x-4 mb-4 p-2 border-b-2 w-full">
				<img src="./assets/memoji-chart-app.png" alt="user-pic" class="w-16 h-16 rounded-full object-cover" />
				<div class="container">
					<h1 class="text-2xl font-bold">Good Morning, David</h1>
					<p class="text-sm mb-4 text-gray-400">
						<span id="dash-date">2024</span> | <span id="dash-location">Chicago, IL.</span>
					</p>
				</div>
			</div>

			<!-- Chart Container -->
			<div class="bg-gray-100 p-4 rounded shadow-md">
				<h3 class="text-xl font-semibold mb-4">Chart Insights</h3>
				<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-4 gap-6">
					<div class="">
						<revenue-chart
							data="[100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]"
							labels='["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct"]'
						></revenue-chart>
					</div>
					<div class="">
						<radar-chart
							data="[65, 59, 70, 20, 56, 55, 40, 10]"
							datasetLabel="Performance Metrics"
							labels='["Revenue", "Net Income", "Operating Margin", "EPS", "ROE", "Debt to Equity", "Current Ratio", "Asset Turnover"]'
						></radar-chart>
					</div>
					<div class="">
						<goals-chart
							data="[3183, 3846, 1058, 174]"
							labels='["Direct", "Organic", "Social", "Referral"]'
						></goals-chart>
					</div>
					<div class="">
						<recycle-chart
							data="[35, 30, 20, 10, 8]"
							labels='["Text", "Images", "Docs", "Videos","other"]'
						></recycle-chart>
					</div>
				</div>
			</div>
		</div>

		<script src="./components/recycle-chart.js"></script>
		<script src="./components/goals-chart.js"></script>
		<script src="./components/revenue-chart.js"></script>
		<script src="./components/radar-chart.js"></script>
		<script src="./main.js"></script>
	</body>
</html>
