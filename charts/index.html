<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700;800;900&display=swap"
			rel="stylesheet"
		/>

		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	</head>
	<body class="font-sans text-gray-900 bg-white">
		<div class="flex max-[600px]:flex-col h-[970px]sm:h-screen">
			<!-- side nav -->
			<div class="max-w-full bg-gray-300 text-white h-auto sm:flex flex-col items-center py-4 space-y-6 hidden">
				<img
					src="./assets/SVG/v2-logo-square.svg"
					alt="Charts App Logo"
					class="mx-6 w-16 h-auto border-b-2 py-4 space-y-6"
				/>
				<nav class="flex-1 w-full h-screen p-4">
					<ul class="flex flex-col items-center">
						<li class="mb-4">
							<a
								href="#"
								class="flex items-center justify-center p-2 text-gray-300 bg-gray-200 hover:text-white rounded"
							>
								<img src="./assets/icons/Home.png" alt="home icon" class="w-8 h-8" />
							</a>
						</li>
						<li class="mb-4">
							<a
								href="#"
								class="flex items-center justify-center p-2 text-gray-300 hover:bg-gray-200 hover:text-white rounded"
							>
								<img src="./assets/icons/health.png" alt="users icon" class="w-8 h-8" />
							</a>
						</li>
						<li class="mb-4">
							<a
								href="#"
								class="flex items-center justify-center p-2 text-gray-300 hover:bg-gray-200 hover:text-white rounded"
							>
								<img src="./assets/icons/wallet.png" alt="settings icon" class="w-8 h-8" />
							</a>
						</li>
						<li class="mb-4">
							<a
								href="#"
								class="flex items-center justify-center p-2 text-gray-300 hover:bg-gray-200 hover:text-white rounded"
							>
								<img src="./assets/icons/watch.png" alt="logout icon" class="w-8 h-8" />
							</a>
						</li>
					</ul>
				</nav>
			</div>

			<div class="sm:hidden w-full bg-gray-300 text-white flex items-center justify-between p-4">
				<!-- Left Icon -->
				<img src="./assets/SVG/v2-logo-square.svg" alt="Charts App Logo" class="w-10 h-auto" />

				<!-- Hamburger Button -->
				<button id="sidebarToggle" class="text-blue-600 focus:outline-none">
					<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
					</svg>
				</button>
			</div>

			<!-- user info and chart container -->
			<div class="container mx-auto p-2">
				<div class="flex items-center space-x-4 mb-4 p-2 border-b-2 w-full">
					<div class="bg-[#0D9488] w-20 h-20 rounded-full flex justify-center items-center">
						<img src="./assets/memoji-chart-app.png" alt="user-pic" class="w-16 h-16 rounded-full object-cover" />
					</div>
					<div class="container">
						<h1 class="text-2xl font-bold">Good Morning, David</h1>
						<p class="text-sm mb-4 text-gray-400">
							<span id="dash-date">2024</span> | <span id="dash-location">Chicago, IL.</span>
						</p>
					</div>
				</div>

				<!-- Chart Container -->
				<div class="bg-gray-100 p-4 rounded shadow-md">
					<h3 class="text-xl font-semibold mb-4">Chart Insights</h3>
					<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-4 gap-6">
						<div class="">
							<revenue-chart
								data="[100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]"
								labels='["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct"]'
							></revenue-chart>
						</div>
						<div class="">
							<radar-chart
								data="[65, 59, 70, 20, 56, 55, 10]"
								datasetLabel="Performance Metrics"
								labels='["Revenue", "Net Income", "Operating Margin", "EPS", "ROE", "Debt to Equity", "Current Ratio"]'
							></radar-chart>
						</div>
						<div class="">
							<goals-chart
								data="[3183, 3846, 1058, 174]"
								labels='["Direct", "Organic", "Social", "Referral"]'
							></goals-chart>
						</div>
						<div class="">
							<recycle-chart
								data="[35, 30, 20, 10, 8]"
								labels='["Text", "Images", "Docs", "Videos","other"]'
							></recycle-chart>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="./components/recycle-chart.js"></script>
		<script src="./components/goals-chart.js"></script>
		<script src="./components/revenue-chart.js"></script>
		<script src="./components/radar-chart.js"></script>
		<script src="./main.js"></script>
	</body>
</html>
